# Codemagic (codemagic.io, free tier): builds an unsigned iPhone app for Sideloadly.
# Start it in Codemagic → this app → "iPhone IPA (unsigned)" → Start new build; download the .ipa from Artifacts.
workflows:
  ios-unsigned:
    name: iPhone IPA (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build the app (no signing)
        script: flutter build ios --release --no-codesign
      - name: Pack TalkMe.ipa
        script: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          mkdir -p out/Payload
          cp -R build/ios/iphoneos/Runner.app out/Payload/
          cd out && zip -qry "TalkMe-$VERSION.ipa" Payload
    artifacts:
      - out/*.ipa
